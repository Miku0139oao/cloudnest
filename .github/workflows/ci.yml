name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    env:
      # Optional Microsoft Trusted Signing. When these secrets are present the
      # portable ZIP is Authenticode-signed; a fork or a repository without
      # them still builds, just unsigned.
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      TRUSTED_SIGNING_CORRELATION_ID: ${{ secrets.TRUSTED_SIGNING_CORRELATION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Add Go bin directory to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts -clean=true

      - name: Type-check frontend
        working-directory: frontend
        run: npm run check

      - name: Check gofmt
        shell: pwsh
        run: |
          $files = & gofmt -l main.go services internal
          if ($LASTEXITCODE -ne 0) {
            throw "gofmt failed with exit code $LASTEXITCODE."
          }
          if ($files) {
            Write-Host "The following files are not gofmt-formatted:"
            $files | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      # build/ios is not buildable on Windows, so scope vet to the app packages.
      - name: Vet Go packages
        run: go vet ./services/... ./internal/...

      - name: Run Go tests
        run: go test ./internal/...

      - name: Build application
        run: wails3 build

      # The ZIP is what users actually download, so build it on every run and
      # not only when a release is published.
      - name: Set up code signing (optional)
        if: env.TRUSTED_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/setup-trusted-signing.ps1 -OutDir "$env:RUNNER_TEMP\trusted-signing" -WriteGitHubEnv

      - name: Package portable ZIP
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -Version "ci-$($env:GITHUB_SHA.Substring(0,7))" -SkipBuild

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: cloudnest-windows-amd64
          path: bin/cloudnest.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cloudnest-portable-windows-amd64
          path: dist/Cloudnest-*-win64.zip
          if-no-files-found: error
