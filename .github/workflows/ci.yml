name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Add Go bin directory to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts -clean=true

      - name: Type-check frontend
        working-directory: frontend
        run: npm run check

      - name: Check gofmt
        shell: pwsh
        run: |
          $files = & gofmt -l main.go services internal
          if ($LASTEXITCODE -ne 0) {
            throw "gofmt failed with exit code $LASTEXITCODE."
          }
          if ($files) {
            Write-Host "The following files are not gofmt-formatted:"
            $files | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      # build/ios is not buildable on Windows, so scope vet to the app packages.
      - name: Vet Go packages
        run: go vet ./services/... ./internal/...

      - name: Run Go tests
        run: go test ./internal/...

      - name: Build application
        run: wails3 build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudnest-windows-amd64
          path: bin/cloudnest.exe
          if-no-files-found: error
