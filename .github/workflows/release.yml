name: Release

# Tags publish a stable release; every push to main refreshes the "nightly"
# pre-release so there is always a ZIP that matches the latest commit.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    name: Build portable Windows release
    runs-on: windows-latest
    env:
      # Optional Microsoft Trusted Signing; see the CI workflow. Without these
      # secrets the release is published unsigned.
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      TRUSTED_SIGNING_CORRELATION_ID: ${{ secrets.TRUSTED_SIGNING_CORRELATION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Add Go bin directory to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts -clean=true

      - name: Build application
        run: wails3 build

      - name: Set up code signing (optional)
        if: env.TRUSTED_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/setup-trusted-signing.ps1 -OutDir "$env:RUNNER_TEMP\trusted-signing" -WriteGitHubEnv

      - name: Package portable ZIP
        shell: pwsh
        env:
          # A tag names the build; anything else is the rolling nightly.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -Version "$env:VERSION" -SkipBuild

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:VERSION
          $zip = "dist/Cloudnest-$tag-win64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Release archive not found: $zip"
          }

          $body = "Portable Windows x64 ZIP.`n`n" +
            "- No installer: unzip the archive anywhere writable and run Cloudnest.exe.`n" +
            "- Settings, logs and staging files live in the data\ folder next to the executable.`n" +
            "- On Windows 10, if the app does not start, install the WebView2 runtime from runtime\MicrosoftEdgeWebview2Setup.exe.`n" +
            "- rclone is bundled in bin\rclone.exe. Cloudnest and rclone are MIT licensed (LICENSES\).`n"

          # State that the build is signed, without publishing the personal
          # details embedded in the signer certificate. The hash lets users
          # verify the download themselves.
          $signature = Get-AuthenticodeSignature -LiteralPath 'dist\Cloudnest\Cloudnest.exe'
          if ($signature.Status -eq 'Valid') {
            $hash = (Get-FileHash -LiteralPath 'dist\Cloudnest\Cloudnest.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            $body += "- Cloudnest.exe is Authenticode-signed and timestamped.`n"
            $body += "- SHA-256 of Cloudnest.exe: $hash`n"
          }
          else {
            $body += "- This build is not Authenticode-signed ($($signature.Status)).`n"
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $tag $zip --title "Cloudnest $tag" --notes $body --verify-tag
          }
          else {
            # Recreate the nightly so the asset always matches the newest main.
            $existing = gh release view nightly --json tagName 2>&1
            if ($LASTEXITCODE -eq 0) {
              gh release delete nightly --yes --cleanup-tag
            }
            gh release create nightly $zip --title "Cloudnest nightly" --prerelease `
              --target $env:GITHUB_SHA --notes $body
          }
