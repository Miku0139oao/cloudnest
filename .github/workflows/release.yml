name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build portable Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Add Go bin directory to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts -clean=true

      - name: Build application
        run: wails3 build

      - name: Package portable ZIP
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -Version "$env:GITHUB_REF_NAME"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "dist/Cloudnest-$tag-win64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Release archive not found: $zip"
          }
          $notes = "Portable Windows x64 ZIP.`n`n- No installer: unzip the archive anywhere writable and run Cloudnest.exe.`n- Settings, logs and staging files live in the data\ folder next to the executable.`n- On Windows 10, if the app does not start, install the WebView2 runtime from runtime\MicrosoftEdgeWebview2Setup.exe.`n- rclone is bundled in bin\rclone.exe; its MIT license is in LICENSES\rclone-COPYING.txt."
          gh release create "$tag" "$zip" --title "Cloudnest $tag" --notes $notes
